plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videooverlay'
version = '1.0.0'

android {
  namespace "expo.modules.videooverlay"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Must match expo-video's androidxMedia3Version: every media3 artifact in one app has to share a version.
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-common:${androidxMedia3Version}"
  implementation "androidx.media3:media3-effect:${androidxMedia3Version}"
  implementation "androidx.media3:media3-transformer:${androidxMedia3Version}"
  implementation "androidx.annotation:annotation-experimental:1.4.1"
}
